apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: seasonal-article-detector-agent
  version: "1.0.0"

provides:
  apis:
    - name: seasonal-article-detector-agent
      kind: a2a
      ordId: customer.build:apiResource:seasonal-article-detector-8a850.seasonal-article-detector-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: replenishment-adjustment-workflow-mcp-server
    kind: mcp-server
    ordId: sap.n8nwfrt:apiResource:seasonal-article-detector-8a850_replenishment-adjustment-workflow.replenishmentAdjustmentReceived_mcp:v1
  - name: classification-notification-workflow-mcp-server
    kind: mcp-server
    ordId: sap.n8nwfrt:apiResource:seasonal-article-detector-8a850_classification-notification-workflow.classificationNotificationReceived_mcp:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
