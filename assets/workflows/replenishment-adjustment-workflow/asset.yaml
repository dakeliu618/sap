apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: replenishment-adjustment-workflow
  description: Receives seasonal article/store classifications and triggers replenishment parameter adjustments
  version: "1.0.0"
  type: n8nworkflow

projectVersion: "1"
sourceRoot: "."

workflow:
  definitionFile: replenishment-adjustment-workflow.n8n.json
  name: replenishment-adjustment-workflow
  ordId: sap.btpn8n:apiResource:ManagedN8nMcpServer:v1

requires:
  - name: seasonal-article-detector-agent
    kind: agent
    ordId: customer.build:agent:seasonal-article-detector-8a850.seasonal-article-detector-agent:v1

provides:
  apis:
    - name: replenishment_adjustment_received
      path: /seasonal-article-detector-8a850/replenishment-adjustment-workflow/replenishment-adjustment-received
      kind: rest
      description: Receives seasonal article classifications and triggers replenishment parameter adjustments
      ordId: "sap.n8nwfrt:apiResource:seasonal-article-detector-8a850_replenishment-adjustment-workflow.replenishmentAdjustmentReceived:v1"
    - name: replenishment_adjustment_received_mcp_server
      kind: mcp-server
      description: MCP server for replenishment adjustment received operations
      ordId: "sap.n8nwfrt:apiResource:seasonal-article-detector-8a850_replenishment-adjustment-workflow.replenishmentAdjustmentReceivedMcpServer:v1"
